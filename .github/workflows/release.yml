name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write # Required for npm Trusted Publishing (OIDC)

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
        exclude:
          - goos: darwin
            goarch: amd64

    steps:
      - uses: actions/checkout@v4

      - name: Validate version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VER=$(grep '"version"' package.json | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$TAG" != "$PKG_VER" ]; then
            echo "❌ Tag v$TAG but package.json says $PKG_VER"
            echo "   Fix: ./scripts/release.sh $TAG"
            exit 1
          fi
          echo "✅ Version match: v$TAG"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      # The OAuth client ID is public by design (it appears in every
      # authorization URL, like rclone/gcalcli/gh). It is NOT in the git repo:
      # CI reads GOOGLE_OAUTH_CREDENTIALS_JSON and bakes client_id/secret into
      # the binary via ldflags (see internal/auth/embedded.go). Nothing secret
      # is shipped in the npm tarball and install.js downloads no credentials.
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CREDS: ${{ secrets.GOOGLE_OAUTH_CREDENTIALS_JSON }}
        run: |
          BINARY="pi-google-services-${{ matrix.goos }}-${{ matrix.goarch }}"
          LDFLAGS="-s -w"
          if [ -n "$CREDS" ]; then
            echo "$CREDS" > /tmp/creds.json
            CLIENT_ID=$(jq -r '.installed.client_id // .web.client_id // empty' /tmp/creds.json)
            CLIENT_SECRET=$(jq -r '.installed.client_secret // .web.client_secret // empty' /tmp/creds.json)
            rm /tmp/creds.json
            if [ -n "$CLIENT_ID" ]; then
              LDFLAGS="$LDFLAGS -X github.com/sombi/pi-google-services/internal/auth.embeddedClientID=$CLIENT_ID"
            fi
            if [ -n "$CLIENT_SECRET" ]; then
              LDFLAGS="$LDFLAGS -X github.com/sombi/pi-google-services/internal/auth.embeddedClientSecret=$CLIENT_SECRET"
            fi
          else
            echo "Warning: GOOGLE_OAUTH_CREDENTIALS_JSON not set. Binary will require BYO credentials."
          fi
          go build -o "$BINARY" -ldflags="$LDFLAGS" .
          gzip -9 -k "$BINARY"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: pi-google-services-${{ matrix.goos }}-${{ matrix.goarch }}.gz
          path: pi-google-services-${{ matrix.goos }}-${{ matrix.goarch }}.gz

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Prepare npm package
        run: |
          mkdir -p publish/bin
          # Binaries (OAuth client is baked in via ldflags; no credentials file)
          find artifacts/ -name "*.gz" -exec cp {} publish/bin/ \;
          # Package files
          cp package.json publish/
          cp README.md publish/
          cp SKILL.md publish/
          cp install.js publish/
          cp uninstall.js publish/

      - name: Publish to npm (OIDC)
        run: |
          cd publish
          npm publish --access public

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: pi-google-services ${{ github.ref_name }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          files: |
            artifacts/**/*.gz
